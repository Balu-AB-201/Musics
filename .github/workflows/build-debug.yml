name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Fetch lyrics modules (submodule missing in this repo)
        run: |
          rm -rf lyrics
          git clone --depth 1 --recurse-submodules https://github.com/lyraMusicApp/lyrics.git lyrics
          rm -rf IconPack
          git clone --depth 1 https://github.com/lyraMusicApp/IconPack.git IconPack || mkdir -p IconPack
          ls lyrics

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyraMusic-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
