name: Validate offline music and EQ feature

on:
  push:
    branches:
      - feature/offline-library-10-band-eq

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Fetch lyrics modules
        run: |
          rm -rf lyrics
          git clone --depth 1 --recurse-submodules https://github.com/lyraMusicApp/lyrics.git lyrics
          rm -rf IconPack
          git clone --depth 1 https://github.com/lyraMusicApp/IconPack.git IconPack || mkdir -p IconPack

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace
